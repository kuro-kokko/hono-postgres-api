name: hono-postgres-api

services:
  api:
    build: ./api
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://pguser:password4321@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    # container_name: postgres  # 同名コンテナが他プロジェクトに存在すると衝突し、スケールも出来なくなるため指定しない
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password4321}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro #末尾のroは読み取り専用の意味
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  db-data:
